name: papyr

services:
  app:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "8080:3000"
    environment:
      DATA_DIR: /data
      META_DIR: /secrets
      COMPILER_URL: http://compiler:4020
      # Optional AI error-fix (bring your own key). Leave unset to disable.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PAPYR_AI_MODEL: ${PAPYR_AI_MODEL:-claude-opus-4-8}
    volumes:
      - papyr-data:/data
      - papyr-secrets:/secrets
    depends_on:
      - compiler
    restart: unless-stopped
    stop_grace_period: 30s

  compiler:
    build:
      context: apps/compiler
    environment:
      DATA_DIR: /data
      COMPILE_TIMEOUT_MS: "120000"
    volumes:
      - papyr-data:/data
    mem_limit: 2g
    pids_limit: 256
    security_opt:
      - no-new-privileges
    restart: unless-stopped

volumes:
  papyr-data:
  papyr-secrets:
