# Minimal Aldine: prebuilt images, two services, done. This is all you need.
# Everything else — building from source, auth/SSO/AI/email options, TLS,
# Postgres/Redis, hardening, resource limits — lives in docker-compose.full.yml.
# Both files share the same project name and volumes, so you can switch
# between them without losing data.
name: aldine

services:
  app:
    image: ghcr.io/trahloff/aldine-app:latest
    ports:
      - "8080:3000"
    volumes:
      - aldine-data:/data
      - aldine-secrets:/secrets
    restart: unless-stopped

  compiler:
    image: ghcr.io/trahloff/aldine-compiler:latest
    volumes:
      - aldine-data:/data
    restart: unless-stopped

volumes:
  aldine-data:
  aldine-secrets:
