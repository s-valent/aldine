name: papyr

services:
  app:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      # bind to all interfaces by default (local dev); set PAPYR_APP_BIND=127.0.0.1
      # in production so only the Caddy reverse proxy faces the internet.
      - "${PAPYR_APP_BIND:-0.0.0.0}:8080:3000"
    environment:
      DATA_DIR: /data
      META_DIR: /secrets
      COMPILER_URL: http://compiler:4020
      # Optional AI error-fix (bring your own key: Anthropic or OpenRouter). Unset = disabled.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PAPYR_AI_MODEL: ${PAPYR_AI_MODEL:-}
      # Optional multi-user auth. AUTH_ENABLED=1 turns on login + per-project access.
      AUTH_ENABLED: ${AUTH_ENABLED:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      PAPYR_PUBLIC_URL: ${PAPYR_PUBLIC_URL:-}
      # Optional error tracking.
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Datastore: blank = flat JSON files (slim single-node default). Set to a
      # Postgres URL for the horizontally-scalable backend (see `postgres` profile).
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - papyr-data:/data
      - papyr-secrets:/secrets
    depends_on:
      - compiler
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - frontend
      - backend

  compiler:
    build:
      context: apps/compiler
    environment:
      DATA_DIR: /data
      COMPILE_TIMEOUT_MS: "120000"
    volumes:
      - papyr-data:/data
    # Hardening: no external egress (internal network), drop all Linux caps,
    # no privilege escalation, bounded CPU/memory/PIDs. Packages are baked into
    # the image at build time, so the compiler never needs the network.
    networks:
      - backend
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    restart: unless-stopped

  # TLS reverse proxy — opt in with `--profile tls` and set PAPYR_DOMAIN.
  # Caddy auto-provisions HTTPS certificates for the domain.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      PAPYR_DOMAIN: ${PAPYR_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - frontend

  # Optional Postgres for the scalable datastore. Enable with `--profile postgres`
  # and set DATABASE_URL=postgres://papyr:papyr@db:5432/papyr in .env.
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-papyr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-papyr}
      POSTGRES_DB: ${POSTGRES_DB:-papyr}
    volumes:
      - papyr-pg:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - backend

networks:
  frontend: {}
  backend:
    internal: true   # compiler (and db) have no route to the internet

volumes:
  papyr-data:
  papyr-secrets:
  papyr-pg:
  caddy-data:
  caddy-config:
