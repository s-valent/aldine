# Minimal Aldine: prebuilt images, two services, done. This is all you need.
# Everything else (building from source, auth/SSO/AI/email options, TLS,
# Postgres/Redis) lives in docker-compose.full.yml. Both files share the same
# project name and volumes, so you can switch between them without losing data.
name: aldine

services:
  app:
    # Built from source so local web/server changes (Agave font, editor UI)
    # ship instead of the pinned upstream image.
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: aldine-app:local
    ports:
      - "8080:3000"
    environment:
      AUTH_ENABLED: ${AUTH_ENABLED:-}
      ALDINE_SSO_ONLY: ${ALDINE_SSO_ONLY:-}
      # Invite-only registration (new accounts need an admin-created invite link).
      ALDINE_INVITE_ONLY: ${ALDINE_INVITE_ONLY:-}
      # Comma-separated admin emails — the only users who can create invite links.
      ALDINE_ADMIN_EMAILS: ${ALDINE_ADMIN_EMAILS:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GITHUB_LOGIN_CLIENT_ID: ${GITHUB_LOGIN_CLIENT_ID:-}
      GITHUB_LOGIN_CLIENT_SECRET: ${GITHUB_LOGIN_CLIENT_SECRET:-}
      ALDINE_PUBLIC_URL: ${ALDINE_PUBLIC_URL:-}
      # AI error-fix via the opencode shim (OpenAI-compatible endpoint).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-opencode}
      ALDINE_AI_BASE_URL: ${ALDINE_AI_BASE_URL:-http://opencode-ai:3000}
      ALDINE_AI_MODEL: ${ALDINE_AI_MODEL:-opencode/big-pickle}
    volumes:
      - aldine-data:/data
      - aldine-secrets:/secrets
    networks:
      - frontend
      - backend
    init: true # reap orphaned git/compile children (node runs as PID 1 otherwise)
    restart: unless-stopped

  compiler:
    build:
      context: .
      dockerfile: compiler-ru/Dockerfile
    image: aldine-compiler:ru
    volumes:
      - aldine-data:/data
    # Hardening: no external egress (internal network), drop all Linux caps, no
    # privilege escalation, bounded memory and PIDs. Packages are baked into the
    # image at build time, so the compiler never needs the network. LaTeX
    # processes untrusted input; keep these. (docker-compose.full.yml adds a CPU
    # cap on top; it is left out here because `cpus:` above the host's core
    # count makes the container refuse to start.)
    networks:
      - backend
    mem_limit: 2g
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    init: true # reap orphaned pdflatex/biber children left by killed latexmk runs
    restart: unless-stopped

  # AI provider: opencode as the model gateway (runs standalone, no keys needed).
  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    volumes:
      - aldine-opencode:/root/.local/share/opencode
    networks:
      - frontend
    init: true
    restart: unless-stopped

  # Translates OpenAI chat/completions (what Aldine sends) into opencode's API.
  opencode-ai:
    image: node:22-alpine
    volumes:
      - ./opencode/shim.js:/app/shim.js:ro
    environment:
      OPENCODE_SERVER_URL: http://opencode:4096
      PORT: 3000
    command: ["node", "/app/shim.js"]
    networks:
      - frontend
    init: true
    restart: unless-stopped

networks:
  frontend: {}
  backend:
    internal: true # the compiler has no route to the internet

volumes:
  aldine-data:
  aldine-secrets:
  aldine-opencode:
