name: Deploy to AWS

# Ships new images to the already-provisioned ECS service. Infrastructure itself
# is managed by Terraform (deploy/aws) and applied separately — this only builds,
# pushes, and rolls the service, so it's safe to run often.
#
# Manual trigger only (no surprise deploys/costs on every push). Requires:
#   - vars.AWS_DEPLOY_ROLE_ARN : an IAM role trusting GitHub OIDC with ECR push +
#     ecs:UpdateService/DescribeServices permission
#   - vars.AWS_REGION          : e.g. eu-central-1
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to build and deploy
        required: false
        default: latest

permissions:
  id-token: write # OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/papyr-server:${{ inputs.tag }}

      - name: Build & push compiler
        uses: docker/build-push-action@v6
        with:
          context: apps/compiler
          file: apps/compiler/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/papyr-compiler:${{ inputs.tag }}

      - name: Roll the ECS service
        run: |
          aws ecs update-service --cluster papyr --service papyr \
            --force-new-deployment --region "${{ vars.AWS_REGION }}"
          aws ecs wait services-stable --cluster papyr --services papyr \
            --region "${{ vars.AWS_REGION }}"
